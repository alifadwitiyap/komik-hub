# Fallback deploy: build image di GitHub Actions → GHCR → Railway pull.
#
# Pakai ini HANYA kalau build langsung di Railway timeout (free plan 10 menit).
# Cara mengaktifkan:
#   1. Push repo ini ke GitHub (private boleh).
#   2. Workflow ini otomatis jalan; tunggu image muncul di
#      https://github.com/users/<user>/packages/container/komik-hub
#   3. Di GHCR, set package visibility = PUBLIC (Railway free bisa pull tanpa
#      kredensial).
#   4. Di Railway: New Service → Deploy from Docker Image →
#      ghcr.io/<user>/komik-hub:latest → tambah volume /data + env.
name: build-image

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
