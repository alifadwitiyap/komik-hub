# Build image di GitHub Actions → GHCR.
#
# Multi-arch (linux/amd64 + linux/arm64):
#   - amd64 → Railway/Render/local
#   - arm64 → VM Oracle A1 (Ampere). Dibangun via QEMU di runner x64.
#
# Cara pakai:
#   1. Push ke main → workflow jalan otomatis.
#   2. Image di https://github.com/users/<user>/packages/container/komik-hub
#   3. Set package visibility = PUBLIC (package → Package settings → Change
#      visibility). WAJIB supaya VM Oracle bisa pull tanpa kredensial.
#      (Isi image bukan rahasia: auth di-inject sebagai env runtime.)
name: build-image

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
