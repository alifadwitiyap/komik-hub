name: CI — Komiku Stack

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
  pull_request:
    branches: [main]

jobs:
  # Server compilation + linting
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: komiku-server
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --message-format=short
      # Gate NYATA: tanpa `|| true`. Dulu kegagalan clippy diabaikan sehingga
      # 11 warning menumpuk tanpa ada yang tahu. Jangan kembalikan `|| true`:
      # gate yang selalu hijau lebih berbahaya daripada tidak ada gate.
      - run: cargo clippy --all-targets -- -D warnings

  # Frontend typecheck + build
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: komiku-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: komiku-web/package-lock.json
      - run: npm ci
      - run: npx tsc -b --pretty false
      - run: npm run build

  # Gate rendered-surface: render halaman sungguhan di browser lalu periksa
  # gambar rusak, overflow, dan error konsol. Ini satu-satunya gate yang
  # menangkap kelas bug "build hijau tapi halaman blank" — React #310 dulu
  # lolos dari tsc + build + 93 unit test.
  #
  # Biaya: unduh Chromium ~150 MB + 1-2 menit per run.
  surface-gate:
    runs-on: ubuntu-latest
    needs: [web, server]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: komiku-server

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: komiku-web/package-lock.json

      - name: Build web
        working-directory: komiku-web
        run: |
          npm ci
          npm run build

      - name: Build server
        working-directory: komiku-server
        run: cargo build

      - name: Install Playwright
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium

      - name: Jalankan server
        working-directory: komiku-server
        run: |
          PORT=8788 ./target/debug/komiku-server > /tmp/server.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -sf -m 2 http://localhost:8788/api/health > /dev/null; then
              echo "server siap"; exit 0
            fi
            sleep 1
          done
          echo "server TIDAK siap dalam 40s"; tail -30 /tmp/server.log; exit 1

      - name: Gate rendered surface
        working-directory: komiku-web
        env:
          BASE_URL: http://localhost:8788
        run: python3 scripts/gate_served_surface.py

      - name: Log server saat gagal
        if: failure()
        run: tail -60 /tmp/server.log || true

