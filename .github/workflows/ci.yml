name: CI — Komiku Stack

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
  pull_request:
    branches: [main]

jobs:
  # Server compilation + linting
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: komiku-server
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --message-format=short
      - run: cargo clippy -- -D warnings || true

  # Frontend typecheck + build
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: komiku-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: komiku-web/package-lock.json
      - run: npm ci
      - run: npx tsc -b --pretty false
      - run: npm run build

  # Kumpulkan artefak build (debug) untuk unduhan/diagnosis.
  build-artifacts:
    runs-on: ubuntu-latest
    needs: [server, web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Collect build outputs
        run: |
          tar -cf server-check-output.tar -C komiku-server target/debug 2>/dev/null || true
          tar -cf web-dist.tar -C komiku-web dist
      - uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            server-check-output.tar
            web-dist.tar
          retention-days: 7
