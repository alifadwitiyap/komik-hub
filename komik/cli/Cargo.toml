[package]
name = "komik"
version = "0.1.0"
edition = "2021"
description = "CLI baca komik multi-sumber (Komiku+/Shinigami/Kiryuu/Mangaku)"

[[bin]]
name = "komik"
path = "src/main.rs"

[dependencies]
komik-core = { path = "../core" }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
anyhow = "1"
# PDF mixed branch (CLI only; core & server tetap lean)
image = "0.25"
