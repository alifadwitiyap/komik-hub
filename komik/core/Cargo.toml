[package]
name = "komik-core"
version = "0.1.0"
edition = "2021"
description = "Unified multi-source manga core: model, source trait, 4 adapters, aggregator"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["default-tls", "json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
async-trait = "0.1"
# kripto adapter komiku (identik dengan komiku-server/src/crypto.rs)
aes = "0.8"
cbc = "0.1"
hmac = "0.12"
sha1 = "0.10"
hex = "0.4"
base64 = "0.22"
