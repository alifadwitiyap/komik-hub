 \u2013 SLASHDOG \u2013&quot;,&quot;slug&quot;:&quot;daten-no-kugami-slashdog&quot;,&quot;synopsis&quot;:&quot;Daten no Kugami berkisah tentang sebuah teknologi canggih yang memungkinkan replika digital manusia atau data cermin untuk berinteraksi di dunia nyata. Cerita berpusat pada tokoh utama yang secara tidak sengaja terjebak dalam konflik antara berbagai kelompok yang ingin menguasai teknologi tersebut demi kepentingan mereka sendiri. Dunia yang penuh dengan intrik dan bahaya ini menuntut mereka untuk beradaptasi dan bertarung demi bertahan hidup serta mengungkap kebenaran di balik teknologi data cermin.\n\nPerjalanan karakter utama membawa mereka mengenal sisi gelap dan terang dari kemajuan teknologi, sambil berjuang melindungi orang-orang yang mereka cintai. Dengan konflik yang semakin memanas dan tantangan yang datang tanpa henti, mereka harus belajar mempercayai diri sendiri dan orang lain untuk menghadapi masa depan yang penuh ketidakpastian dan risiko besar.&quot;,&quot;status&quot;:&quot;Ongoing&quot;,&quot;source_url&quot;:&quot;https:\/\/komiku.org\/manga\/daten-no-kugami-slashdog\/&quot;,&quot;poster&quot;:&quot;https:\/\/komiku.org\/wp-content\/uploads\/2022\/10\/Daten-no-Kugami-\u2013-SLASHDOG-\u2013-1.png?w=500&quot;,&quot;type&quot;:&quot;Manga&quot;,&quot;author&quot;:&quot;-&quot;,&quot;artist&quot;:&quot;-&quot;,&quot;is_featured&quot;:0,&quot;rating&quot;:null,&quot;release_year&quot;:2026,&quot;views_count&quot;:28,&quot;created_at&quot;:&quot;2026-05-10T05:43:30.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-10-10T23:43:34.000000Z&quot;,&quot;shared_genres_count&quot;:6,&quot;last_chapter&quot;:{&quot;id&quot;:315042,&quot;manga_id&quot;:6152,&quot;title&quot;:&quot;Chapter 1&quot;,&quot;slug&quot;:&quot;chapter-1&quot;,&quot;chapter_number&quot;:1,&quot;source_url&quot;:&quot;https:\/\/komiku.org\/daten-no-kugami-slashdog-chapter-1\/&quot;,&quot;content&quot;:null,&quot;views_count&quot;:10,&quot;created_at&quot;:&quot;2026-05-10T05:43:31.0
