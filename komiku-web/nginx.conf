# Komik Hub — nginx: SPA shell + /api,/img proxy to the Rust backend.
# Upstream `komiku-server:8788` is the compose service name (lane L2 image).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Komik pages are image-heavy; raise upload cap for future batch imports.
    client_max_body_size 20m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Docker embedded DNS (127.0.0.11). REQUIRED: $UPSTREAM_* are variables,
    # so nginx does not resolve komiku-server at config-parse time — that
    # means a compose stack that starts web before komiku-server boots the web
    # container fine (missing backend = 502 on /api), instead of dying with
    # `host not found in upstream` the way a static proxy_pass does.
    # NOTE: 127.0.0.11 only exists on user-defined networks (compose always
    # creates one). A bare `docker run` on the default bridge gets the VM's
    # DNS instead, so /api hangs there until resolver_timeout — expected, not
    # a config bug; test proxy paths on a compose-style network.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # ── API + images → Rust backend ────────────────────────────────────────
    # Upstream sources (komiku, kiryuu, ...) are slow and occasionally hang,
    # hence the 600s ceilings. Never proxy /api to the host's native 8788
    # server from inside a container: that address is not reachable there.
    #
    # Matchers are regex, not `/api/` prefixes: the frontend's own contract
    # uses the BARE path — imgUrl.ts builds `/img?u=...` and sw.js tests
    # `url.pathname === '/img'` exactly. A `/img/` prefix location never
    # matches those, and nginx then 301-redirects `/img` → `/img/` (query
    # string carried along) instead of proxying, so every manga image breaks.
    location ~ ^/api(/|$) {
        set $UPSTREAM_API "http://komiku-server:8788";
        proxy_pass $UPSTREAM_API;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Chunked/streamed responses from upstream must not be buffered.
        proxy_buffering off;
        proxy_request_buffering off;

        proxy_connect_timeout 60s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }

    location ~ ^/img(/|$) {
        set $UPSTREAM_IMG "http://komiku-server:8788";
        proxy_pass $UPSTREAM_IMG;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Images are immutable per CDN path — let the browser cache them for a
        # month. (Query-string URLs, so an extension regex would never match.)
        add_header Cache-Control "public, max-age=2592000, immutable" always;

        proxy_connect_timeout 60s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }

    # ── SPA static ─────────────────────────────────────────────────────────
    # Hashed Vite assets are content-addressed → cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, or a deploy leaves stale shells.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    # /sw.js: revalidate so the service worker picks up new deploys.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
