<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="128x128" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#0b0b0d" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f1f4f7" media="(prefers-color-scheme: light)" />
    <meta name="description" content="Baca manga, manhwa, dan manhua bahasa Indonesia — mode maraton seperti aplikasi Komik Hub." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Komik Hub" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Komik Hub — baca manga, mode maraton</title>
    <!--
      Preload font HANYA yang dipakai di layar pertama untuk TEKS BODY:
      Nunito Sans 400. `crossorigin` wajib walau same-origin — font selalu
      di-fetch dalam mode CORS, tanpa atribut ini preload jadi fetch ganda.

      BR Hendrix (display/judul) SENGAJA TIDAK di-preload lagi. Terukur di
      400 kbps: 2 file itu = 45 KB yang berebut bandwidth dengan JS di 3 detik
      pertama, dan judul yang memakainya baru ada SETELAH JS jalan — jadi
      preload-nya murni menunda halaman yang sedang dibaca. `font-display:
      swap` di index.css sudah menjamin teks tampil pakai font fallback dulu.
    -->
    <!--
      ...dan hasilnya: preload DIKEMBALIKAN. Terukur 3 run di 400 kbps,
      page1 7,18 s (dengan preload) vs 7,22 s (tanpa) — selisih di dalam
      noise. Setelah halaman 1 jadi penentu, byte font bukan lagi bottleneck;
      membuang preload cuma menambah risiko FOUT tanpa waktu yang dibeli.
    -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/NunitoSans-Regular.woff2" crossorigin />
    <!--
      SKELETON BOOT — structural, CSS-only, dan DI LUAR #root:

      Di 400 kbps, bundle (react-vendor + app + css ≈ 122 KB gzip) butuh ~5 detik
      sebelum React bisa menggambar apa pun. Skeleton ini menyerupai geometri
      home mobile (topbar 56px, px-4, hero 16/7, grid 3 kolom 3/4) supaya
      transisi ke React tidak menggeser konten. React melakukan fade-out 180ms
      lalu menghapus node ini (~220ms); #root tetap kosong saat mount.

      ATURAN KERAS:
      - JANGAN menaruh URL aset apa pun di skeleton (CSS inline semua).
      - JANGAN ubah script bootstrap tema di bawah ini (localStorage
        'komik-theme' → html.dark) dan preload NunitoSans di atas.
      - Skeleton HARUS sibling #root, bukan anak #root: createRoot akan
        membersihkan anak #root saat mount.
    -->
    <style>
      :root {
        --kb-bg: #f1f4f7; --kb-surface: #ffffff; --kb-line: #e3e7ec;
        --kb-muted: #6f7681; --kb-shine: rgba(255, 255, 255, .8);
        --ease-out-quint: cubic-bezier(0.22, 1, 0.36, 1);
        --ease-in-out-fast: cubic-bezier(0.4, 0, 0.2, 1);
      }
      html.dark {
        --kb-bg: #0a0c0f; --kb-surface: #13161c; --kb-line: #1b2029;
        --kb-muted: #8e97a4; --kb-shine: rgba(255, 255, 255, .075);
      }
      html { background: var(--kb-bg); }
      body { margin: 0; background: var(--kb-bg); color: var(--kb-muted);
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      #boot-skeleton {
        position: fixed; inset: 0; z-index: 45; overflow: hidden;
        background: var(--kb-bg); pointer-events: none;
        transition: opacity 180ms var(--ease-out-quint);
      }
      #boot-skeleton[data-fading='true'] { opacity: 0; }
      .kb-boot-bar {
        position: fixed; inset: 0 0 auto 0; z-index: 1; height: 56px;
        display: flex; align-items: center; justify-content: space-between;
        box-sizing: border-box; padding: 0 16px; padding-top: env(safe-area-inset-top);
        background: var(--kb-bg); border-bottom: 1px solid var(--kb-line);
      }
      .kb-boot-logo { width: 96px; height: 20px; border-radius: 6px; }
      .kb-boot-actions { display: flex; gap: 8px; }
      .kb-boot-dot { width: 30px; height: 30px; border-radius: 999px; }
      .kb-boot-body {
        box-sizing: border-box; height: 100%; max-width: 768px; margin: 0 auto;
        padding: calc(56px + env(safe-area-inset-top) + 12px) 16px
                 calc(88px + env(safe-area-inset-bottom));
        overflow: hidden;
      }
      .kb-boot-hero { aspect-ratio: 16 / 7; max-height: 170px; border-radius: 12px; }
      .kb-boot-line { height: 14px; margin: 20px 0 12px; border-radius: 5px; width: 42%; }
      .kb-boot-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
      .kb-boot-tile { aspect-ratio: 3 / 4; border-radius: 12px; }
      .kb-boot-line, .kb-boot-dot, .kb-boot-hero, .kb-boot-tile, .kb-boot-logo {
        background: var(--kb-surface); border: 1px solid var(--kb-line);
      }
      .kb-boot-shimmer { position: relative; overflow: hidden; }
      .kb-boot-shimmer::after {
        content: ''; position: absolute; inset: 0; transform: translateX(-100%);
        background: linear-gradient(90deg, transparent, var(--kb-shine), transparent);
        animation: kb-shimmer 1.4s var(--ease-in-out-fast) infinite;
      }
      @keyframes kb-shimmer { to { transform: translateX(100%) } }
      @media (prefers-reduced-motion: reduce) {
        .kb-boot-shimmer::after { animation: none; }
        #boot-skeleton { transition: none; }
      }
    </style>
    <script>
      // Tema sebelum paint pertama: skeleton tidak boleh kedip terang untuk
      // user mode gelap. Sumber sama dengan `src/theme.ts` (key `komik-theme`).
      try {
        var t = localStorage.getItem('komik-theme')
        if (t !== 'light' && t !== 'dark') {
          t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        if (t === 'dark') document.documentElement.classList.add('dark')
        document.documentElement.style.colorScheme = t
        document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) { m.setAttribute('content', t === 'dark' ? '#0b0b0d' : '#f1f4f7'); m.removeAttribute('media') }) // status bar ikut tema aktif (nilai sama dengan theme.ts)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-skeleton" aria-hidden="true">
      <div class="kb-boot-bar">
        <span class="kb-boot-logo kb-boot-shimmer"></span>
        <span class="kb-boot-actions">
          <span class="kb-boot-dot kb-boot-shimmer"></span>
          <span class="kb-boot-dot kb-boot-shimmer"></span>
          <span class="kb-boot-dot kb-boot-shimmer"></span>
        </span>
      </div>
      <div class="kb-boot-body">
        <div class="kb-boot-hero kb-boot-shimmer"></div>
        <div class="kb-boot-line kb-boot-shimmer"></div>
        <div class="kb-boot-grid">
          <div class="kb-boot-tile kb-boot-shimmer"></div>
          <div class="kb-boot-tile kb-boot-shimmer"></div>
          <div class="kb-boot-tile kb-boot-shimmer"></div>
          <div class="kb-boot-tile kb-boot-shimmer"></div>
          <div class="kb-boot-tile kb-boot-shimmer"></div>
          <div class="kb-boot-tile kb-boot-shimmer"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
